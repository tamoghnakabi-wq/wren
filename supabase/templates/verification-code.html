<!-- Supabase Auth "Magic Link" email. Wren only uses it for verification codes (two-step sign-in and
     confirming sensitive actions), so it shows the code and no sign-in link. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1f1b16;">
  <h2 style="font-size: 18px; margin: 0 0 12px;">Your Wren verification code</h2>
  <p style="font-size: 14px; line-height: 1.5; margin: 0 0 16px;">Enter this code in Wren to continue. It works once and expires in 10 minutes.</p>
  <p style="font-size: 28px; letter-spacing: 6px; font-weight: 600; font-family: ui-monospace, Menlo, monospace; margin: 0 0 16px;">{{ .Token }}</p>
  <p style="font-size: 12px; line-height: 1.5; color: #706860; margin: 0;">If you didn't try to sign in or change something in Wren, someone may know your password: change it, and turn on two-step sign-in with an authenticator app.</p>
</div>
