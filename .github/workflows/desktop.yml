name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release (otherwise build artifacts only)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm test -w packages/core
      - run: npm test -w apps/desktop
      - run: npx tsc --noEmit -p apps/desktop

  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node scripts/package.mjs mac
        working-directory: apps/desktop
      - name: Self-test the packaged app
        run: |
          ./apps/desktop/release/mac-arm64/Wren.app/Contents/MacOS/Wren --selftest
      # A command that leaves something running: it is found and stopped.
      - name: Self-test process cleanup
        run: |
          WREN_DATA_DIR="$RUNNER_TEMP/wren-proctree-test" ./apps/desktop/release/mac-arm64/Wren.app/Contents/MacOS/Wren --selftest --proctree
      # Downloads the latest published release through the updater's own code path.
      - name: Self-test the updater download
        run: |
          WREN_DATA_DIR="$RUNNER_TEMP/wren-update-test" ./apps/desktop/release/mac-arm64/Wren.app/Contents/MacOS/Wren --selftest --update
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node scripts/package.mjs win
        working-directory: apps/desktop
      - name: Smoke-test the installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter Wren.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$app) { throw "Wren.exe was not installed under $env:LOCALAPPDATA\Programs" }
          Write-Host "Installed at $($app.FullName)"
          $out = & $app.FullName --selftest | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed" }
      # A command that leaves something running: inside its Job Object it ends with the command;
      # without one it is still found (by parent id) and stopped.
      - name: Self-test process cleanup
        shell: pwsh
        run: |
          $app = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter Wren.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $env:WREN_DATA_DIR = Join-Path $env:RUNNER_TEMP 'wren-proctree-test'
          $out = & $app.FullName --selftest --proctree | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "Process cleanup self-test failed" }
      # Downloads the latest published release through the updater's own code path (it once failed on Windows only).
      - name: Self-test the updater download
        shell: pwsh
        run: |
          $app = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter Wren.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $env:WREN_DATA_DIR = Join-Path $env:RUNNER_TEMP 'wren-update-test'
          $out = & $app.FullName --selftest --update | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "Updater download self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/desktop/release/*-setup.exe
          if-no-files-found: error

  publish:
    needs: [mac, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Sign update manifest
        env:
          WREN_UPDATER_KEY: ${{ secrets.WREN_UPDATER_KEY }}
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          node scripts/release-manifest.mjs "$VERSION" dist "${{ github.repository }}" "$TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=releases/$TAG.md
          [ -f "$NOTES" ] || echo "Wren $VERSION" > "$NOTES"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Wren $VERSION" --notes-file "$NOTES" --prerelease
          gh release upload "$TAG" dist/*.dmg dist/*.zip dist/*.exe dist/wren-update.json --clobber
